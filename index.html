<script>
/* ===========================
   SIDEBAR (IMPROVED)
=========================== */
const sidebar = document.getElementById("sidebar");
const handle = document.getElementById("pullHandle");
const header = document.getElementById("header");
const footer = document.querySelector("footer.progress");

let isOpen = false;

// posisi awal
gsap.set(sidebar, { x: "-100%" });

// buka sidebar
handle.addEventListener("click", () => {
  gsap.to(sidebar, {
    x: 0,
    duration: 0.5,
    ease: "power3.out"
  });
  isOpen = true;
});

// tutup sidebar
function closeSidebar() {
  gsap.to(sidebar, {
    x: "-100%",
    duration: 0.4,
    ease: "power3.in"
  });
  isOpen = false;
}

/* ===========================
   AUTO HIDE HEADER
=========================== */
let lastScroll = 0;
window.addEventListener("scroll", () => {
  const now = window.scrollY;
  header.style.transform =
    now > lastScroll ? "translateY(-100%)" : "translateY(0)";
  lastScroll = now;
});

/* ===========================
   ZEN MODE
=========================== */
let zen = false;
let lastTap = 0;

function toggleZen() {
  zen = !zen;

  gsap.to([header, handle, footer, sidebar], {
    opacity: zen ? 0 : 1,
    pointerEvents: zen ? "none" : "auto",
    duration: 0.3
  });

  document.body.classList.toggle("zen-mode", zen);
  closeSidebar();
}

// double tap / click
window.addEventListener("click", () => {
  const now = Date.now();
  if (now - lastTap < 350) toggleZen();
  lastTap = now;
});

// shortcut Z
window.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "z") toggleZen();
});
</script>
