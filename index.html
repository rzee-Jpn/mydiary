<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pustaka — Private Archive</title>

  <!-- SEO -->
  <meta name="description" content="Pustaka adalah arsip pengetahuan pribadi.">
  <meta name="keywords" content="pustaka, arsip, buku, knowledge">
  <meta name="author" content="Zhie">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/library.css">

  <!-- WebSite Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Pustaka",
    "url": "https://books.anglumea.com"
  }
  </script>
</head>

<body>

<header class="lib-header">
  <img src="img/logo.png" alt="Logo Pustaka">
  <div class="title">
    <h1>Pustaka</h1>
    <small>Private Knowledge Archive</small>
  </div>
</header>

<main>

  <!-- SEARCH -->
  <div class="search-bar">
    <label for="bookSearch" class="sr-only">Cari arsip</label>
    <input id="bookSearch" placeholder="Cari judul, penulis, atau tag…" autocomplete="off">
  </div>
  
    <div class="daily-quote reveal" id="dailyQuote">
  <p id="quoteText"></p>
  <span id="quoteAuthor"></span>
</div>

  <!-- TOP -->
  <section class="reveal">
    <h2>Top Mingguan</h2>
    <div id="topList" class="embed-list"></div>
  </section>

  <!-- LATEST -->
  <section class="reveal">
    <h2 id="latestTitle">Post Terbaru</h2>
    <div id="catalog" class="embed-list"></div>

    <div class="latest-nav">
      <button id="latestPrev" aria-label="Sebelumnya" disabled>←</button>
      <span id="latestIndicator"></span>
      <button id="latestNext" aria-label="Berikutnya">→</button>
    </div>
  </section>

  <!-- CATEGORY -->
  <section class="reveal">
    <h2>Kategori</h2>
    <div id="categoryList" class="category-list"></div>
  </section>

</main>

<!-- ItemList Schema (filled by JS) -->
<script id="schema-books" type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": []
}
</script>

<script src="assets/js/library.js"></script>
</body>
</html>
