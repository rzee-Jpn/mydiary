<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pustaka — Private Archive</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Pustaka adalah arsip pengetahuan pribadi. Temukan buku, artikel, dan informasi terbaru dengan mudah.">
  <meta name="keywords" content="arsip buku, pustaka, private archive, knowledge, pengetahuan, library">
  <meta name="author" content="Zhie">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/library.css">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Pustaka",
    "url": "https://books.anglumea.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://books.anglumea.com/?s={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

</head>

<body>

<header class="lib-header">
  <img src="img/logo.png" alt="Logo Pustaka — Private Knowledge Archive" loading="lazy">
  <div class="title">
    <h1>Pustaka</h1>
    <small>Private Knowledge Archive</small>
  </div>
</header>

<main>

  <!-- SEARCH -->
  <div class="search-bar">
    <input id="bookSearch" placeholder="Cari judul, penulis, atau tag…">
  </div>

  <!-- TOP WEEKLY -->
  <section class="reveal">
    <h2>Top Mingguan</h2>
    <div id="topList" class="embed-list"></div>
  </section>

  <!-- LATEST -->
  <section class="reveal">
    <h2 id="latestTitle">Post Terbaru</h2>

    <div id="catalog" class="embed-list"></div>

    <div class="latest-nav">
      <button id="latestPrev" disabled>←</button>
      <span id="latestIndicator"></span>
      <button id="latestNext">→</button>
    </div>
  </section>

  <!-- CATEGORY -->
  <section class="reveal">
    <h2>Category</h2>
    <div id="categoryList" class="category-list"></div>
  </section>

</main>

<script src="assets/js/library.js"></script>
</body>
</html>
