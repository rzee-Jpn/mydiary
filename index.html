<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pustaka</title>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/library.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>

<body class="theme-paper">

<header class="lib-header">
  <div class="logo">
    <img src="img/logo.png" alt="Logo">
  </div>
  <div class="title">Pustaka</div>
  <div class="byline">by Anglumea</div>
</header>

<main>

  <!-- ========================= -->
  <!-- 🔥 TOP WEEKLY SLIDER     -->
  <!-- ========================= -->
  <section class="weekly-section">
    <h2>🔥 Terbanyak Dibaca Minggu Ini</h2>

    <div class="weekly-wrapper">
      <button class="weekly-nav prev" type="button">‹</button>
      <div id="weeklySlider" class="weekly-track"></div>
      <button class="weekly-nav next" type="button">›</button>
    </div>
  </section>

  <!-- ========================= -->
  <!-- 🔍 SEARCH                 -->
  <!-- ========================= -->
  <div class="search-wrapper">
    <button id="searchToggle" class="search-icon" type="button">🔍</button>
    <input id="bookSearch" type="search" placeholder="Cari buku...">
  </div>

  <!-- ========================= -->
  <!-- 📚 LATEST BOOKS           -->
  <!-- ========================= -->
  <section class="latest-section">
    <h2>📚 Buku Terbaru</h2>

    <div id="latestCatalog" class="catalog-grid"></div>

    <div class="pager">
      <button id="prevPage" type="button">Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPage" type="button">Next</button>
    </div>
  </section>

  <!-- ========================= -->
  <!-- 📂 CATEGORY FILTER        -->
  <!-- ========================= -->
  <section class="category-section">
    <h2>📂 Kategori</h2>

    <!-- TAB KATEGORI -->
    <div id="categoryTabs" class="category-tabs"></div>

    <!-- HASIL FILTER -->
    <div id="catalog" class="catalog-grid"></div>
  </section>

</main>

<!-- HARUS views.js dulu -->
<script src="assets/js/views.js"></script>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<!-- library.js TERAKHIR -->
<script src="assets/js/library.js"></script>

</body>
</html>
