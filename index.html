<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyDiary Reader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="theme-paper">

<header id="header" class="reader-header">
  <div class="back-btn" onclick="history.back()">←</div>
  <div class="logo">📖 MyDiary</div>
</header>

<div id="pullHandle">≡</div>

<aside id="sidebar">
  <section>
    <h4>Buku</h4>
    <div id="bookTitle">Memuat…</div>
  </section>

  <section>
    <h4>Tema</h4>
    <select id="themeSelect">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="sepia">Sepia</option>
      <option value="paper" selected>Paper</option>
    </select>
  </section>

  <section>
    <button id="ttsBtn">🔊 Bacakan</button>
  </section>

  <section>
    <h4>Daftar Bab</h4>
    <ul id="tocList"></ul>
  </section>
</aside>

<main id="reader"></main>

<footer class="progress">
  <span id="progressText">0%</span>
  <div class="bar">
    <div id="progressBar"></div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<script>
/* ===========================
   SIDEBAR
=========================== */
const sidebar = document.getElementById("sidebar");
const handle = document.getElementById("pullHandle");
const header = document.getElementById("header");
const footer = document.querySelector("footer.progress");

let isOpen = false;
gsap.set(sidebar, { x: "-100%" });

handle.addEventListener("click", () => {
  gsap.to(sidebar, {
    x: isOpen ? "-100%" : 0,
    duration: 0.4,
    ease: "power3.out"
  });
  isOpen = !isOpen;
});

/* ===========================
   AUTO HIDE HEADER
=========================== */
let lastScroll = 0;
window.addEventListener("scroll", () => {
  const now = window.scrollY;
  header.style.transform = now > lastScroll ? "translateY(-100%)" : "translateY(0)";
  lastScroll = now;
});

/* ===========================
   ZEN MODE (FIXED)
=========================== */
let zen = false;
let lastTap = 0;

function toggleZen() {
  zen = !zen;

  if (zen) {
    gsap.to([header, handle, footer], {
      opacity: 0,
      pointerEvents: "none",
      duration: 0.3
    });

    gsap.to(sidebar, {
      x: "-100%",
      opacity: 0,
      pointerEvents: "none",
      duration: 0.3
    });

    document.body.classList.add("zen-mode");
    isOpen = false;

  } else {
    gsap.to([header, handle, footer], {
      opacity: 1,
      pointerEvents: "auto",
      duration: 0.3
    });

    gsap.to(sidebar, {
      x: "-100%",
      opacity: 1,
      pointerEvents: "auto",
      duration: 0.3
    });

    document.body.classList.remove("zen-mode");
  }
}

/* double tap ONLY on empty area */
window.addEventListener("touchend", (e) => {
  if (e.target.closest("button, select, a, input")) return;

  const now = Date.now();
  if (now - lastTap < 300) toggleZen();
  lastTap = now;
});

/* ===========================
   TEXT TO SPEECH (FIXED)
=========================== */
const ttsBtn = document.getElementById("ttsBtn");

if ("speechSynthesis" in window && ttsBtn) {
  let utterance;

  ttsBtn.addEventListener("click", () => {
    speechSynthesis.cancel();

    const text = document.getElementById("reader")?.innerText?.trim();
    if (!text) return;

    utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "id-ID";
    utterance.rate = 1;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
  });

} else if (ttsBtn) {
  ttsBtn.style.display = "none";
}
</script>

<script src="assets/js/settings.js"></script>
<script src="assets/js/book-loader.js"></script>
<script src="assets/js/progress.js"></script>

</body>
</html>
