<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader</title>

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/reader.css">
<link rel="stylesheet" href="assets/css/sidebar.css">
<link rel="stylesheet" href="assets/css/theme.css">
</head>

<body class="theme-paper">

<header id="header" class="reader-header">
  <div class="back-btn" onclick="history.back()">←</div>
  <div class="logo">📖 MyDiary</div>
</header>

<div id="pullHandle">≡</div>

<aside id="sidebar">
  <div id="closeSidebar">✕</div>
  <h4>Buku</h4>
  <div id="bookTitle">...</div>

  <h4>Tema</h4>
  <select id="themeSelect">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="sepia">Sepia</option>
    <option value="paper" selected>Paper</option>
  </select>

  <h4>Daftar Bab</h4>
  <ul id="tocList"></ul>
</aside>

<main id="reader"></main>

<footer class="progress">
  <span id="progressText">0%</span>
  <div class="bar"><div id="progressBar"></div></div>
</footer>

<!-- FLOATING CONTROLS -->
<div id="floatingControls">
  <button id="zoomIn">A+</button>
  <button id="zoomOut">A−</button>
  <button id="ttsFloat" title="Play TTS">🔊</button>
  <button id="ttsStop" title="Stop TTS">⏹</button>
</div>

<div id="translateBar">
  <select id="translateLang">
    <option value="">🌐 Original</option>
    <option value="id">🇮🇩</option>
    <option value="en">🇬🇧</option>
    <option value="ja">🇯🇵</option>
    <option value="ar">🇸🇦</option>
  </select>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<script src="assets/js/state.js"></script>
<script src="assets/js/reader-core.js"></script>
<script src="assets/js/progress.js"></script>
<script src="assets/js/resume.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/translate.js"></script>
<script src="assets/js/tts.js"></script>
<script src="assets/js/ui.js"></script>

</body>
</html>
