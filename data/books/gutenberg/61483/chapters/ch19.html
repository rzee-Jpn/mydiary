<h2>SOURCES OF WEALTH.</h2>
<p>8.<a id="def8"></a> Land, labour, and capital. The two
original sources, are land and labour; but
the aid which labour receives from capital is
<span class="pageno" id="Page_236">236</span>applied so very early, and is so very necessary
in the production of wealth, that it may
be considered as a third source.</p>
