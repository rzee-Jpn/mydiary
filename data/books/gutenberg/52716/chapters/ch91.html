<h2>GRAPEFRUIT AND ORANGE</h2>
<p>In preparing grapefruit to serve, chill the fruit
thoroughly, cut in two crosswise, remove the seeds with a
sharp pointed knife, remove the center, and, slipping the
knife down between rind and pulp, loosen all around without
cutting the tissue.</p>
