<h2>TABLE SHOWING THE MEANS OF THE DAILY MAXIMUM AND MINIMUM
TEMPERATURES IN DEGREES FAHRENHEIT.</h2>
<p>The Means are obtained by dividing the sum of the daily readings of the Maximum and Minimum Self-registering
Thermometers by the number of days in the month.</p>
