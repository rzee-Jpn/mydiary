<h2>Explanation of the French Monies, Weights, and Measures
used in the following pages.</h2>
<p>The figures following the denomination are decimal parts;
thus: 7 <i>fr.</i> 25, 6 <i>met.</i> 50 represent respectively 7¼ <i>francs</i>,
6½ <i>metres</i>.</p>
