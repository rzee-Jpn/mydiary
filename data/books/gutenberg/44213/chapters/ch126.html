<h2>IV. WAGES</h2>
<p>"1. Equal pay for equal work, without discrimination as to sex.</p>
<p>"2. Maintenance of existing wage rates for basic working day.</p>
<p>"3. Time and one-half for all hours beyond basic working day.</p>
<p>"4. Wage rates to be periodically revised to correspond with variations
in the cost of living.</p>
