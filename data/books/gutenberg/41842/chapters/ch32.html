<h2>INCONVENIENTES</h2>
<p>1.º Que no resisten largo tiempo las altas presiones de las prensas
hidráulicas.</p>
<p>2.º Su elevado coste.</p>
<p>3.º Que, cuando nuevos, prestan un gusto <i>sui generis</i> á los aceites,
siendo menester tratarlos con<a id="page_088"></a> agua hirviendo antes de emplearlos.</p>
