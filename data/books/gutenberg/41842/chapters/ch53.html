<h2>FILTROS</h2>
<p>La filtración puede efectuarse:</p>
<p><i>a.</i> De arriba abajo, ejemplo el filtro Yanardi.</p>
<p><i>b.</i> De costado, filtro Cosus.</p>
<p><i>c.</i> De abajo arriba, filtro Kloz.</p>
<p><i>d.</i> De dentro afuera ó al contrario.</p>
<p><i>c.</i> Filtro mecánico.<a id="page_125"></a></p>
<p><i>d.</i> Filtro prensa.</p>
