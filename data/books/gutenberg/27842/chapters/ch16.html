<h2>Water (Hydrosphere)</h2>
<p>It has been estimated that all the water of the earth, including the
ocean, surface waters, and underground waters, constitutes about 7 per
cent of the volume of the earth to a depth of 10 miles.<a id="FNanchor_3_3"></a><a class="fnanchor pginternal" href="#Footnote_3_3">[3]</a></p>
