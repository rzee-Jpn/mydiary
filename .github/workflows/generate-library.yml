name: Gutenberg Daily

on:
  schedule:
    # Jalan tiap hari jam 01:00 UTC (≈ 08:00 WIB)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    concurrency:
      group: gutenberg-crawler
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Gutenberg crawler
        run: |
          python crawler/crawler.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data crawler

          # Stop kalau tidak ada perubahan
          git diff --cached --quiet && echo "No changes detected" && exit 0

          git commit -m "crawler: add up to 3 Gutenberg books ($(date -u +%Y-%m-%d))"
          git push